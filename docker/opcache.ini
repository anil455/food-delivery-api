; Without this, the opcache extension is loaded but never actually caches
; compiled bytecode, so PHP re-lexes and re-compiles every vendor file on
; every single request. That is the dominant cost behind a several-second
; response time even on the lightest endpoints.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; The image is rebuilt fresh on every deploy, so source files never change
; underneath a running container — skip the per-request mtime check.
opcache.validate_timestamps=0
